name: First CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Building application"
          echo "Build completed"

  test_job:
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Testing application"
          echo "All tests passed"

  deploy_job:
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deploying application"
          echo "Deployment completed"